<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Battle Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="topbar">
        <div class="hudBox">❤️ <span id="health">100</span></div>
        <div class="hudBox">🔫 <span id="ammo">30</span></div>
        <div class="hudBox">💀 <span id="kills">0</span></div>
        <div class="hudBox">👥 <span id="alive">11</span></div>
      </div>

      <div id="zoneText">ZONE: 100%</div>
    </div>

    <div id="message"></div>

    <!-- Mobile controls -->
    <div id="mobileControls">
      <div id="joystick">
        <div id="stick"></div>
      </div>

      <button id="shootBtn">🔫</button>
      <button id="reloadBtn">↻</button>
    </div>

    <div id="startScreen">
      <h1>⚡ BATTLE LITE</h1>
      <p>Lightweight Battle Royale</p>
      <button id="startBtn">START GAME</button>
      <small>PC: WASD + Mouse<br>Mobile: Joystick + Shoot</small>
    </div>

    <div id="gameOver">
      <h1 id="gameOverTitle">GAME OVER</h1>
      <p>Kills: <span id="finalKills">0</span></p>
      <button id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
